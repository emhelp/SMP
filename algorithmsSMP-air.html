<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Анестезиология и реанимация - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>🫀 Анестезиология и реанимация</h1>

<div class="algorithms-menu">
  <!-- А -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-allergic-edema.html'">
    Аллергический отек верхних дыхательных путей
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-anaphylactic-shock.html'">
    Анафилактический шок
  </button>
  
  <!-- В -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hyperthermia.html'">
    Воздействие высоких температур (тепловой обморок, тепловые судороги)
  </button>
  
  <!-- Г -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hemorrhagic-shock.html'">
    Геморрагический шок (острая массивная кровопотеря), травматический шок
  </button>
  
  <!-- Д -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-dehydration.html'">
    Дегидратация, уменьшение объема жидкости, гиповолемический шок
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-respiratory-failure.html'">
    Дыхательная недостаточность:<br>– гипоксемическая (острый респираторный дистресс синдром (некардиогенный отек легких), острая сердечная недостаточность)<br>– вентиляционная (ХОБЛ, бронхиальная астма) II–IV ст.
  </button>
  
  <!-- И -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-foreign-body.html'">
    Инородное тело в дыхательных путях
  </button>
  
  <!-- К -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-coma.html'">
    Кома (в том числе неустановленного генеза)
  </button>
  
  <!-- О -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-burn-shock.html'">
    Ожоговый шок, термоингаляционная травма
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-cardiac-arrest.html'">
    Остановка сердца неуточненная. Фибрилляция и трепетание желудочков. Желудочковая тахикардия. Внезапная сердечная смерть
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-brain-edema.html'">
    Отек головного мозга (всегда является осложнением, объем медицинской помощи оказывается в дополнение к основному заболеванию)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hypothermia.html'">
    Общее охлаждение организма (гипотермия)
  </button>
  
  <!-- П -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-electric-shock.html'">
    Поражение электрическим током (в т.ч. поражение молнией)
  </button>
  
  <!-- С -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-septic-shock.html'">
    Септический шок, инфекционно-токсический шок
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-strangulation.html'">
    Странгуляционная асфиксия (повешение, удушение)
  </button>
  
  <!-- У -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-postresuscitation.html'">
    Успешная сердечно-легочная реанимация (постреанимационный период)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-drowning.html'">
    Утопление
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
