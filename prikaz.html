<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Приказы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .prikaz-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .prikaz-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 12px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .prikaz-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .prikaz-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .prikaz-menu {
      max-width: 95%;
    }
    .prikaz-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<h1>📋 Приказы СМП</h1>

<div class="prikaz-menu">
  <button class="prikaz-btn" onclick="window.location.href='ekp.html'">Передача ЭКП</button>
  <button class="prikaz-btn" onclick="window.location.href='alcohol.html'">Выписка спирта</button>
  <button class="prikaz-btn" onclick="window.location.href='methods.html'">Медотходы и профилактика аварийных ситуаций</button>
  <button class="prikaz-btn" onclick="window.location.href='antivich.html'">Аварийные ситуации АнтиВИЧ</button>
  <button class="prikaz-btn" onclick="window.location.href='vitals.html'">Мониторинг витальных функций</button>
  <button class="prikaz-btn" onclick="window.location.href='routing.html'">Изменение маршрутизации пациентов с амбулаторной травмой</button>
  <button class="prikaz-btn" onclick="window.location.href='algorithms.html'">Изменения в результатах Алгоритмов</button>
  <button class="prikaz-btn" onclick="window.location.href='nsipv.html'">Образец применения НСиПВ в карте вызова</button>
  <button class="prikaz-btn" onclick="window.location.href='prochee/coma_diff.html'">Диф.диагностика комы</button>
  <button class="prikaz-btn" onclick="window.location.href='prochee/stroke_regulations.html'">Регламент ведения пациентов с ОНМК</button>
  <button class="prikaz-btn" onclick="window.location.href='prochee/heart-brain-button.html'">Когда нажимать «полусердце-полумозг»</button>
</div>

<script>
  // Вибрация при нажатии на любую кнопку
  document.querySelectorAll('.prikaz-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (navigator.vibrate) {
        navigator.vibrate(10);
      }
    });
  });
  
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ SW зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка:', err));
  }
</script>

</body>
</html>
