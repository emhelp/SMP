<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Кардиология</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .cardiology-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .cardiology-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 12px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .cardiology-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .cardiology-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .cardiology-menu {
      max-width: 95%;
    }
    .cardiology-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<h1>❤️ Кардиология</h1>

<div class="cardiology-menu">
  <button class="cardiology-btn" onclick="window.location.href='prochee/atherosclerotic_cardiosclerosis.html'">Атеросклеротический кардиосклероз</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/hypertension_stage2.html'">Гипертоническая болезнь 2 стадии</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/hypertension_stage2_crisis.html'">Гипертоническая болезнь 2 стадии. Криз</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/myocardial_infarction.html'">Инфаркт с подъемом ST</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/cardiomyopathy.html'">Кардиомиопатия алкогольная с ХСН</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/supraventricular_tachycardia.html'">Наджелудочковая тахикардия</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/unstable_angina.html'">Нестабильная стенокардия</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/hypotension.html'">Низкое артериальное давление</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/pulmonary_edema.html'">Отек легких</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/elevated_bp_no_htn.html'">Повышенное артериальное давление без гипертонической болезни</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/aortic_dissection.html'">Расслаивающаяся аневризма аорты</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/sinus_tachycardia.html'">Синусовая тахикардия</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/sss_syndrome.html'">Синдром слабости синусового узла (СССУ)</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/atrial_flutter.html'">Трепетание предсердий</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/pulmonary_embolism.html'">ТЭЛА</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/pe_small_branches.html'">ТЭЛА мелкие ветви</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/atrial_fibrillation.html'">ФП</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/fp_48hours_arrhythmogenic_shock.html'">ФП до 48 часов, аритмогенный шок, сопор-кома</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/fp_arrhythmogenic_shock_recovery.html'">ФП, аритмогенный шок, восстановление</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/chf.html'">ХСН</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/chf_2a.html'">ХСН II А</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/chf_3fc_shoks8.html'">ХСН III ФК ШОКС 8</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/chf_cardiac_asthma_pulmonary_edema.html'">ХСН, сердечная астма (отек легких)</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/extrasystole.html'">Экстрасистолия</button>
  <button class="cardiology-btn" onclick="window.location.href='prochee/ectopic_tachycardia_arrhythmogenic_shock.html'">Эктопическая тахикардия, аритмогенный шок</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ SW зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка:', err));
  }
</script>

</body>
</html>
