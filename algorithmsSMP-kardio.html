<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Кардиология - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 14px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>❤️ Кардиология</h1>

<div class="algorithms-menu">
  <!-- Б -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-bradyarrhythmia-adults.html'">
    Брадиаритмии и нарушения проводимости у взрослых
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-bradyarrhythmia-children.html'">
    Брадисистолические нарушения сердечного ритма у детей
  </button>
  
  <!-- Г -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hypertensive-crisis.html'">
    Гипертонический криз
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hypertension-no-crisis.html'">
    Гипертоническая болезнь (вне криза)
  </button>
  
  <!-- К -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-cardiogenic-shock.html'">
    Кардиогенный шок
  </button>
  
  <!-- О -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-acute-lv-failure.html'">
    Острая левожелудочковая недостаточность (сердечная астма, отек легких)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-nstemi.html'">
    Острый коронарный синдром без подъема сегмента ST
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-stemi.html'">
    Острый инфаркт миокарда с подъемом сегмента ST
  </button>
  
  <!-- П -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-paroxysmal-tachycardia-narrow.html'">
    Пароксизмы эктопической тахикардии QRS &lt; 0,12 секунд (тахикардии с узким комплексом) у взрослых
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-paroxysmal-tachycardia-wide.html'">
    Пароксизмы эктопической тахикардии QRS &gt; 0,12 сек (тахикардии с широким комплексом) у взрослых
  </button>
  
  <!-- Р -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-aortic-aneurysm.html'">
    Расслаивающая аневризма аорты
  </button>
  
  <!-- С -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-sinus-tachycardia.html'">
    Синусовая тахикардия
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-stable-ischemic-heart-disease.html'">
    Стабильная ИБС. Стабильная стенокардия
  </button>
  
  <!-- Т -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-tachycardia-children.html'">
    Тахисистолические нарушения сердечного ритма у детей
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-pe.html'">
    Тромбоэмболия легочной артерии
  </button>
  
  <!-- Ф -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-atrial-fibrillation.html'">
    Фибрилляция – трепетание предсердий
  </button>
  
  <!-- Х -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-chronic-heart-failure.html'">
    Хроническая сердечная недостаточность
  </button>
  
  <!-- Э -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-extrasystole.html'">
    Экстрасистолия (в том числе желудочковая, частая и парная)
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
