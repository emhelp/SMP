<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Терапия</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .therapy-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .therapy-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 12px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .therapy-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .therapy-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .therapy-menu {
      max-width: 95%;
    }
    .therapy-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<h1>💊 Терапия</h1>

<div class="therapy-menu">
  <button class="therapy-btn" onclick="window.location.href='anemia.html'">Анемия</button>
  <button class="therapy-btn" onclick="window.location.href='arthritis.html'">Артрит</button>
  <button class="therapy-btn" onclick="window.location.href='arthrosis.html'">Артроз</button>
  <button class="therapy-btn" onclick="window.location.href='status_asthmaticus.html'">Астматический статус</button>
  <button class="therapy-btn" onclick="window.location.href='bronchial_asthma.html'">Бронхиальная астма</button>
  <button class="therapy-btn" onclick="window.location.href='hemorrhagic_vasculitis2.html'">Геморрагический васкулит</button>
  <button class="therapy-btn" onclick="window.location.href='hydrothorax.html'">Гидроторакс</button>
  <button class="therapy-btn" onclick="window.location.href='hyperglycemia.html'">Гипергликемия</button>
  <button class="therapy-btn" onclick="window.location.href='hypoglycemia.html'">Гипогликемия</button>
  <button class="therapy-btn" onclick="window.location.href='hypothyroidism.html'">Гипотиреоз</button>
  <button class="therapy-btn" onclick="window.location.href='hiccup.html'">Икота</button>
  <button class="therapy-btn" onclick="window.location.href='cachexia.html'">Кахексия</button>
  <button class="therapy-btn" onclick="window.location.href='coxarthrosis.html'">Коксартроз</button>
  <button class="therapy-btn" onclick="window.location.href='urticaria.html'">Крапивница</button>
  <button class="therapy-btn" onclick="window.location.href='generalized_urticaria.html'">Крапивница генерализованная</button>
  <button class="therapy-btn" onclick="window.location.href='hemoptysis.html'">Кровохарканье</button>
  <button class="therapy-btn" onclick="window.location.href='angioedema.html'">Отек Квинке</button>
  <button class="therapy-btn" onclick="window.location.href='hepatic_failure.html'">Печеночная недостаточность</button>
  <button class="therapy-btn" onclick="window.location.href='gout.html'">Подагра</button>
  <button class="therapy-btn" onclick="window.location.href='psoriasis.html'">Псориаз</button>
  <button class="therapy-btn" onclick="window.location.href='sigmoid_colon_cancer.html'">Рак сигмовидной</button>
  <button class="therapy-btn" onclick="window.location.href='pancreatic_cancer.html'">Рак поджелудочной</button>
  <button class="therapy-btn" onclick="window.location.href='thyrotoxicosis.html'">Тиреотоксикоз</button>
  <button class="therapy-btn" onclick="window.location.href='copd.html'">ХОБЛ</button>
  <button class="therapy-btn" onclick="window.location.href='cirrhosis.html'">Цирроз печени</button>
  <button class="therapy-btn" onclick="window.location.href='hepatic_encephalopathy.html'">Цирроз печеночная энцефалопатия</button>
  <button class="therapy-btn" onclick="window.location.href='esophagitis.html'">Эзофагит</button>
  <button class="therapy-btn" onclick="window.location.href='eczema.html'">Экзема</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ SW зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка:', err));
  }
</script>

</body>
</html>
