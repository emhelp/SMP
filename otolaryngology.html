<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Оториноларингология</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .otolaryngology-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .otolaryngology-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 12px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .otolaryngology-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .otolaryngology-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .otolaryngology-menu {
      max-width: 95%;
    }
    .otolaryngology-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<h1>👂 ЛОР и схожие состояния</h1>

<div class="otolaryngology-menu">
  <button class="otolaryngology-btn" onclick="window.location.href='ear_amputation.html'">Ампутация уха</button>
  <button class="otolaryngology-btn" onclick="window.location.href='pharynx_foreign_body.html'">Инородное тело глотки</button>
  <button class="otolaryngology-btn" onclick="window.location.href='nose_foreign_body.html'">Инородное тело носа</button>
  <button class="otolaryngology-btn" onclick="window.location.href='ear_foreign_body.html'">Инородное тело уха</button>
  <button class="otolaryngology-btn" onclick="window.location.href='external_auditory_canal_bleeding.html'">Кровотечение из наружного слухового прохода</button>
  <button class="otolaryngology-btn" onclick="window.location.href='post_tonsillectomy_bleeding.html'">Кровотечение после тонзиллэктомии</button>
  <button class="otolaryngology-btn" onclick="window.location.href='epistaxis.html'">Носовое кровотечение</button>
  <button class="otolaryngology-btn" onclick="window.location.href='epistaxis_resolved.html'">Носовое кровотечение состоявшееся</button>
  <button class="otolaryngology-btn" onclick="window.location.href='otitis.html'">Отит</button>
  <button class="otolaryngology-btn" onclick="window.location.href='purulent_otitis.html'">Отит гнойный</button>
  <button class="otolaryngology-btn" onclick="window.location.href='peritonsillar_abscess.html'">Паратонзиллярный абсцесс</button>
  <button class="otolaryngology-btn" onclick="window.location.href='parotitis.html'">Паротит</button>
  <button class="otolaryngology-btn" onclick="window.location.href='vasomotor_rhinitis.html'">Ринит вазомоторный</button>
  <button class="otolaryngology-btn" onclick="window.location.href='allergic_rhinoconjunctivitis.html'">Риноконъюнктивит аллергический</button>
  <button class="otolaryngology-btn" onclick="window.location.href='earwax_plug.html'">Серная пробка</button>
  <button class="otolaryngology-btn" onclick="window.location.href='sialadenitis.html'">Сиалоаденит</button>
  <button class="otolaryngology-btn" onclick="window.location.href='sinusitis.html'">Синусит</button>
  <button class="otolaryngology-btn" onclick="window.location.href='tympanic_membrane_rupture.html'">Травматический разрыв барабанной перепонки</button>
  <button class="otolaryngology-btn" onclick="window.location.href='pharyngitis.html'">Фарингит</button>
  <button class="otolaryngology-btn" onclick="window.location.href='epiglottitis.html'">Эпиглоттит</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ SW зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка:', err));
  }
</script>

</body>
</html>
