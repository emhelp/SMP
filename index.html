<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скорая помощь</title>
  <meta name="description" content="Справочник для специалистов скорой помощи. Алгоритмы, калькуляторы, шаблоны карт.">
  <link rel="icon" href="1712743647196.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1446">
  
  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EMHelp">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* Разделённая кнопка */
    .split-btn-wrapper {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    
    .split-btn-container {
      display: flex;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .split-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      line-height: 1.3;
      text-align: center;
      background: linear-gradient(135deg, #800000 0%, #5a0000 100%);
      box-sizing: border-box;
    }
    
    .split-btn-max {
      border-radius: 12px 0 0 12px;
      clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
      padding-right: 20px;
    }
    
    .split-btn-vk {
      border-radius: 0 12px 12px 0;
      clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
      padding-left: 20px;
      margin-left: -10px;
    }
    
    .split-btn:hover {
      filter: brightness(1.15);
    }
    
    .split-btn:active {
      filter: brightness(0.9);
    }

    /* ==== Круглые надписи вокруг кнопок шапки ==== */
    .header-btn-left,
    .header-btn-right {
      position: relative;
      overflow: visible;
    }
    
    /* SVG с круговым текстом — по размеру больше кнопки */
    .header-btn-left .circle-label,
    .header-btn-right .circle-label {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      overflow: visible;
    }
    
    .header-btn-left .circle-label text,
    .header-btn-right .circle-label text {
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #0f1446;
      letter-spacing: 0.8px;
    }
    
    @media (max-width: 600px) {
      .split-btn-wrapper {
        max-width: 90%;
      }
      
      .split-btn {
        font-size: 13px;
        padding: 12px 8px;
      }
      
      .split-btn-max {
        clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%);
        padding-right: 16px;
      }
      
      .split-btn-vk {
        clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%);
        padding-left: 16px;
        margin-left: -8px;
      }

      .header-btn-left .circle-label,
      .header-btn-right .circle-label {
        width: 88px;
        height: 88px;
      }
      
      .header-btn-left .circle-label text,
      .header-btn-right .circle-label text {
        font-size: 10px;
        letter-spacing: 0.6px;
      }
    }
    
    @media (max-width: 380px) {
      .split-btn {
        font-size: 12px;
        padding: 10px 6px;
      }

      .header-btn-left .circle-label,
      .header-btn-right .circle-label {
        width: 82px;
        height: 82px;
      }
      
      .header-btn-left .circle-label text,
      .header-btn-right .circle-label text {
        font-size: 9px;
        letter-spacing: 0.5px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="feedback.html" class="header-btn header-btn-left" id="contact-btn">
      <svg class="circle-label" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <path id="arc-top-left" d="M 12,50 A 38,38 0 0 1 88,50" fill="none" />
          <path id="arc-bottom-left" d="M 12,50 A 38,38 0 0 0 88,50" fill="none" />
        </defs>
        <text>
          <textPath href="#arc-top-left" startOffset="50%" text-anchor="middle">Нашёл ошибку?</textPath>
        </text>
        <text>
          <textPath href="#arc-bottom-left" startOffset="50%" text-anchor="middle" side="left">— напиши</textPath>
        </text>
      </svg>
      <i class="fas fa-envelope"></i>
    </a>
    
    <div class="header-center">
      <img src="1712743647196.png" alt="Логотип" class="logo">
      <h1>Скорая помощь</h1>
      <p>"EMHelp Group" 2012-2026 v.145</p>
    </div>
    
    <button class="header-btn header-btn-right" id="share-btn">
      <svg class="circle-label" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <path id="arc-top-right" d="M 12,50 A 38,38 0 0 1 88,50" fill="none" />
          <path id="arc-bottom-right" d="M 12,50 A 38,38 0 0 0 88,50" fill="none" />
        </defs>
        <text>
          <textPath href="#arc-top-right" startOffset="50%" text-anchor="middle">Поделись</textPath>
        </text>
        <text>
          <textPath href="#arc-bottom-right" startOffset="50%" text-anchor="middle" side="left">с другом</textPath>
        </text>
      </svg>
      <i class="fas fa-share-alt"></i>
    </button>
  </div>

  <nav class="menu">
    <a href="install-instruction.html" class="menu-btn">Инструкция</a>
    <a href="templates.html" class="menu-btn">ШАБЛОНЫ КАРТ</a>
    <a href="status.html" class="menu-btn">STATUS LOCALIS</a>
    <a href="calculators.html" class="menu-btn">КАЛЬКУЛЯТОРЫ</a>
    <a href="algorithmsSMP.html" class="menu-btn gradient">АЛГОРИТМЫ</a>
    <a href="kody.html" class="menu-btn burgundy">КОДЫ</a>
    <a href="algorithms_apps.html" class="menu-btn burgundy">ПРИЛОЖЕНИЯ К АЛГОРИТМАМ</a>
    <a href="grify.html" class="menu-btn burgundy">ГРИФАМ МСК</a>
    <a href="prochee/grafik-smen.html" class="menu-btn burgundy">ГРАФИК СМЕН</a>

    <div class="split-btn-wrapper">
      <div class="split-btn-container">
        <button class="split-btn split-btn-max" id="max-btn">
          Мы в Макс
        </button>
        <button class="split-btn split-btn-vk" id="vk-btn">
          Мы ВКонтакте
        </button>
      </div>
    </div>
  </nav>

  <script>
    // Вибрация при нажатии на любую кнопку меню
    document.querySelectorAll('.menu-btn, .split-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (navigator.vibrate) {
          navigator.vibrate(10);
        }
      });
    });
    
    // Кнопка Max
    document.getElementById('max-btn').addEventListener('click', () => {
      window.open('https://max.ru/EMHelp_Channel', '_blank');
    });
    
    // Кнопка ВКонтакте — открытие приложения
    document.getElementById('vk-btn').addEventListener('click', () => {
      const vkGroupUrl = 'https://vk.ru/emhelp';
      const vkAppUrl = 'vk://vk.ru/emhelp';
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      
      if (isMobile) {
        const start = Date.now();
        window.location.href = vkAppUrl;
        
        setTimeout(() => {
          if (Date.now() - start < 1500) {
            window.open(vkGroupUrl, '_blank');
          }
        }, 1000);
      } else {
        window.open(vkGroupUrl, '_blank');
      }
    });
  </script>

  <script>
    document.getElementById('share-btn').addEventListener('click', async () => {
      const shareData = {
        title: 'EMHelp - Скорая помощь',
        text: 'Справочник для специалистов скорой помощи. Алгоритмы, калькуляторы, шаблоны карт!',
        url: window.location.href
      };
      
      try {
        if (navigator.share) {
          await navigator.share(shareData);
          console.log('✅ Поделились успешно');
        } else {
          alert('Поделиться можно так: скопируйте ссылку и отправьте друзьям:\n' + window.location.href);
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error('❌ Ошибка шеринга:', err);
          alert('Не удалось открыть окно поделиться');
        }
      }
    });
  </script>

  <script>
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(granted => {
        if (granted) {
          console.log('✅ Постоянное хранилище разрешено');
        } else {
          console.log('⚠️ Постоянное хранилище не разрешено');
        }
      });
    }

    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(estimate => {
        const usedMB = (estimate.usage / 1024 / 1024).toFixed(1);
        const quotaMB = (estimate.quota / 1024 / 1024).toFixed(1);
        console.log(`💾 Использовано: ${usedMB} MB из ${quotaMB} MB`);
      });
    }

    let refreshing = false;
    
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
      
      navigator.serviceWorker.register('/SMP/sw.js')
        .then(reg => {
          console.log('✅ Сервис-воркер зарегистрирован:', reg);
          setInterval(() => { reg.update(); }, 3600000);
        })
        .catch(err => console.error('❌ Ошибка регистрации сервис-воркера:', err));
    }
  </script>

</body>
</html>
