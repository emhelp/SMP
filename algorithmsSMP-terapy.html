<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Терапия - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>🩺 Терапия</h1>

<div class="algorithms-menu">
  <button class="algorithms-btn" onclick="window.location.href='terapy-angiootek.html'">Ангионевротический отек. Крапивница</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-anemia.html'">Анемия</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-kostmysh.html'">Болезни костно-мышечной системы и соединительных тканей (артрозы, артриты и т.д.)</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-ba.html'">Бронхиальная астма</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-gipokoma.html'">Гипогликемическая кома</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-giposost.html'">Гипогликемическое состояние (содержание глюкозы &lt; 3,9 ммоль/л)</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-giperkoma.html'">Диабетические гипергликемические комы</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-dka.html'">Диабетический кетоацидоз (гипергликемическое состояние – прекома)</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-aststatus.html'">Жизнеугрожающая астма (астматический статус) или ДН III–IV ст.</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-dializ.html'">Зависимость от почечного диализа</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-onko.html'">Злокачественные новообразования</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-addison.html'">Надпочечниковый криз (Аддисонов)</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-transplant.html'">Наличие трансплантированной почки</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-gemofilia.html'">Наследственный дефицит фактора VIII (Гемофилия А). Наследственный дефицит фактора IX (Гемофилия В). Болезнь Виллебранда</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-pnevmonia.html'">Пневмония (внебольничная, госпитальная)</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-opn.html'">Почечная недостаточность (острая). Острый гломерулонефрит, быстро прогрессирующий гломерулонефрит</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-tireotox.html'">Тиреотоксический криз</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-hbp.html'">Хроническая болезнь почек (диабетическая нефропатия, нефротический синдром)</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-hobl.html'">Хроническая обструктивная болезнь легких</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-cirroz.html'">Цирроз печени</button>
  <button class="algorithms-btn" onclick="window.location.href='terapy-yazva.html'">Язвенная болезнь желудка и 12-перстной кишки, без осложнений</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
