<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Грифам МСК - Скорая помощь</title>
  <link rel="icon" href="1712743647196.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1446">
  
  <style>
    body {
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #0f1446;
      font-size: 28px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    
    .menu-btn {
      display: block;
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 16px 0;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin: 6px auto;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    .menu-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }
    
    .menu-btn:active {
      transform: scale(0.98);
    }
    
    /* Кнопка "КОНСИЛИУМЫ МСК" — тёмно-синяя */
    .menu-btn.grify-item {
      background-color: #0f1446 !important;
      background-image: none !important;
      color: white;
    }
    
    /* Кнопка "ПРИКАЗЫ МСК" — градиент (сине-красный) */
    .menu-btn.gradient {
      background: linear-gradient(135deg, #0f1446 0%, #800000 100%) !important;
      color: white;
    }
    
    /* Кнопка "ПОДСТАНЦИИ МСК" — тёмно-красная */
    .menu-btn.burgundy {
      background-color: #800000 !important;
      background-image: none !important;
      color: white;
    }
    
    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }
      .menu-btn {
        font-size: 16px;
        padding: 14px 0;
        max-width: 95%;
      }
    }
  </style>
</head>
<body>

  <h1>🚑 Грифам МСК</h1>

  <nav class="menu">
    <a href="consilium.html" class="menu-btn grify-item">КОНСИЛИУМЫ МСК</a>
    <a href="prikaz.html" class="menu-btn grify-item gradient">ПРИКАЗЫ МСК</a>
    <a href="stations.html" class="menu-btn grify-item burgundy">ПОДСТАНЦИИ МСК</a>
  </nav>

  <!-- РЕГИСТРАЦИЯ СЕРВИС-ВОРКЕРА -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/SMP/sw.js')
        .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
        .catch(err => console.error('❌ Ошибка:', err));
    }
  </script>

</body>
</html>
