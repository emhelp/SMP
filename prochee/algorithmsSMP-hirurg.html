<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Хирургия - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>🔪 Хирургия</h1>

<div class="algorithms-menu">
  <!-- В -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-varicose-veins.html'">
    Варикозно-расширенные вены нижних конечностей
  </button>
  
  <!-- Г -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-gangrene.html'">
    Гангрена
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-hemorrhoids.html'">
    Геморрой
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-hernia.html'">
    Грыжи брюшной стенки
  </button>
  
  <!-- И -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-foreign-body.html'">
    Инородное тело желудочно-кишечного тракта
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-skin-infections.html'">
    Инфекции кожи и подкожной клетчатки
  </button>
  
  <!-- К -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-varicose-bleeding.html'">
    Кровотечение из варикозно-расширенных вен пищевода
  </button>
  
  <!-- Л -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-legochnoe-bleeding.html'">
    Легочное кровотечение
  </button>
  
  <!-- О -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-complications.html'">
    Осложнения травм и медицинских манипуляций
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-osteomyelitis.html'">
    Остеомиелит (исключение: одонтогенный)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-ileus.html'">
    Острая кишечная непроходимость, инвагинация кишечника
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-arterial-occlusion.html'">
    Острая окклюзия магистральных артерий верхних и нижних конечностей
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-zheludochnoe-bleeding.html'">
    Острое желудочно-кишечное кровотечение
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-mesenterial.html'">
    Острое нарушение мезентериального кровообращения
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-appendicitis.html'">
    Острый аппендицит
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-pancreatitis.html'">
    Острый панкреатит
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-thrombophlebitis.html'">
    Острый тромбофлебит верхних и нижних конечностей
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-cholecystitis.html'">
    Острый холецистит
  </button>
  
  <!-- П -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-peritonitis.html'">
    Перитонит распространенный
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-perforated-ulcer.html'">
    Перфоративная язва желудка и 12-перстной кишки
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-postcholecystectomy.html'">
    Постхолецистэктомический синдром
  </button>
  
  <!-- С -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-pneumothorax.html'">
    Спонтанный пневмоторакс
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-esophagus-rupture.html'">
    Спонтанный разрыв пищевода
  </button>
  
  <!-- Т -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-hirurg-trophic-ulcers.html'">
    Трофические язвы
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
