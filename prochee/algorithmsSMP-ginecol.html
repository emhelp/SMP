<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Акушерство и гинекология - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>🤰 Акушерство и гинекология</h1>

<div class="algorithms-menu">
  <!-- А -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-algodismenorrhea.html'">
    Альгодисменорея
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-uterine-bleeding.html'">
    Аномальное маточное кровотечение. Кровотечение в менопаузном и постменопаузном периоде. Другие аномальные кровотечения из матки и влагалища (в том числе: посткоитальные или контактные кровотечения)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-ovarian-cyst-rupture.html'">
    Апоплексия яичника. Разрыв кисты яичника. Перекрут кисты яичника
  </button>
  
  <!-- В -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-ectopic-pregnancy.html'">
    Внематочная беременность
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-prolapse.html'">
    Выпадение женских половых органов
  </button>
  
  <!-- Г -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-ovarian-hyperstimulation.html'">
    Гиперстимуляция яичников
  </button>
  
  <!-- Д -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-home-birth.html'">
    Домашние роды. Роды вне родильного дома
  </button>
  
  <!-- К -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-bartholin-abscess.html'">
    Киста бартолиновой железы. Абсцесс бартолиновой железы
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-abortion-bleeding.html'">
    Кровотечение после аборта
  </button>
  
  <!-- Л -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-lactostasis.html'">
    Лактостаз
  </button>
  
  <!-- М -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-lactation-mastitis.html'">
    Мастит лактационный
  </button>
  
  <!-- О -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-postpartum-complications.html'">
    Осложнения послеродового периода: эндометрит и др.
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-adnexitis.html'">
    Острый сальпингит, оофорит, эндометрит. Острый тазовый перитонит у женщин, острый параметрит и др.
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-edema-pregnancy.html'">
    Отеки, вызванные беременностью
  </button>
  
  <!-- П -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-postpartum-sepsis.html'">
    Послеродовый сепсис
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-postpartum-hemorrhage.html'">
    Послеродовое кровотечение (до 42 дней после родов)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-placenta-previa.html'">
    Предлежание плаценты
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-premature-placental-abruption.html'">
    Преждевременная отслойка нормально расположенной плаценты
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-abortion-termination.html'">
    Прерывание беременности в сроке до 22 недель
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-eclampsia.html'">
    Эклампсия (при беременности и послеродовом периоде)
  </button>
  
  <!-- Р -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-uterine-rupture.html'">
    Разрыв матки
  </button>
  
  <!-- С -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-chronic-hypertension.html'">
    Существовавшая ранее гипертензия, осложняющая беременность, роды и послеродовый период (хроническая артериальная гипертензия). Вызванная беременностью гипертензия (гестационная артериальная гипертензия). Преэклампсия
  </button>
  
  <!-- У -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-premature-labor.html'">
    Угрожающие преждевременные роды. Преждевременный разрыв плодных оболочек. Преждевременные роды. Роды одноплодные. Роды многоплодные
  </button>
  
  <!-- Ц -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-endometritis.html'">
    Эндометрит после аборта
  </button>
  
  <!-- Ч -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ginecol-hyperemesis.html'">
    Чрезмерная рвота беременных
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
