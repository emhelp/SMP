<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Травматология - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>🦴 Травматология</h1>

<div class="algorithms-menu">
  <!-- Б -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-cast-pain.html'">
    Боли «под гипсом»
  </button>
  
  <!-- В -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-limb-dislocation.html'">
    Вывихи костей верхних и нижних конечностей:<br>– плечевой кости<br>– грудиноключичного сустава<br>– костей предплечья<br>– костей запястья<br>– пальцев кисти<br>– костей голени<br>– голеностопного, коленного сустава<br>– пальцев стопы
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-jaw-dislocation.html'">
    Вывих нижней челюсти
  </button>
  
  <!-- Г -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-hemothorax.html'">
    Гемоторакс
  </button>
  
  <!-- З -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-closed-abdomen.html'">
    Закрытая травма живота
  </button>
  
  <!-- О -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-frostbite.html'">
    Отморожение
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-open-abdomen.html'">
    Открытая травма живота
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-open-wounds.html'">
    Открытые раны (огнестрельные, колотые, резаные, укушенные и т.д.)
  </button>
  
  <!-- П -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-closed-fracture.html'">
    Переломы костей верхних и нижних конечностей, закрытые
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-open-fracture.html'">
    Переломы костей верхних и нижних конечностей, открытые
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-pelvis-fracture.html'">
    Перелом костей таза. Вывих бедренной кости
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-spine-fracture.html'">
    Перелом позвоночника. Вывих шейного позвонка
  </button>
  
  <!-- Р -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-crush-amputation.html'">
    Размозжения и отчленения конечностей (фрагментов конечностей)
  </button>
  
  <!-- С -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-crush-syndrome.html'">
    Синдром длительного сдавления
  </button>
  
  <!-- Т -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-burns.html'">
    Термические и химические ожоги
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-chest.html'">
    Травма грудной клетки: ушиб грудной клетки, изолированные переломы менее 3-х ребер, множественные переломы ребер (3 ребра и более), перелом первого и второго ребер, перелом грудины
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-genitalia.html'">
    Травма наружных половых органов
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-pneumothorax.html'">
    Травматический пневмоторакс (открытый, закрытый, напряженный)
  </button>
  
  <!-- У -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-heart.html'">
    Ушиб, ранение сердца
  </button>
  
  <!-- Ч -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithm-travma-head-neck.html'">
    Черепно-мозговая травма. Сотрясение головного мозга. Перелом свода и/или основания черепа. Ушиб головного мозга. Травматическое субарахноидальное кровоизлияние. Внутричерепная гематома. Поверхностная травма волосистой части головы. Перелом лицевых костей (костей носа, скуловой кости, верхней, нижней челюсти и др.). Раны лица, шеи, полости рта и волосистой части головы. Ушиб горла, шейного отдела пищевода, глотки, гортани, трахеи. Открытая рана, затрагивающая гортань и шейный отдел трахеи. Перелом хрящей гортани, трахеи
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
