<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Токсикология - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>☠️ Токсикология</h1>

<div class="algorithms-menu">
  <!-- О -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-analgesics.html'">
    Отравление анальгезирующими, жаропонижающими и противоревматическими средствами
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-antibiotics.html'">
    Отравление антибиотиками, другими противоинфекционными и противопаразитарными средствами, гормонами, их синтетическими заменителями и антагонистами не классифицированными в других рубриках
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-anticholinergic.html'">
    Отравление антихолинергическими, антимускаринными и спазмолитическими средствами (атропин, беллоид). Отравление спазмолитическими средствами (дротаверин, папаверин). Отравление β-адреноблокаторами
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-anticholinesterase.html'">
    Отравление ингибиторами холинэстеразы (прозерин, нивалин)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-anticonvulsant.html'">
    Отравление противосудорожных, седативных, снотворных и противопаркинсонических средств (барбитураты, бензодиазепины, финлепсин, циклодол и др.). Отравление психотропных средств неклассифицированных в других рубриках (антидепрессанты, клозапин, галоперидол, фенотиазины и др.)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-antidiabetic.html'">
    Отравление противодиабетическими препаратами
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-cardiovascular.html'">
    Отравление препаратами, действующими преимущественно на сердечно-сосудистую систему (сердечные гликозиды, противоаритмические, клофелин, адельфан, резерпин, кавинтон, трентал, циннаризин, стугерон)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-psychoactive.html'">
    Отравление другими синтетическими наркотиками, кокаином, амфетаминами (экстази), галлюциногенами: каннабиноиды (анаша, гашиш), лизергины (ЛСД), псилоцин, псилоцибин (грибы псилоцибы), мескалин (кактус), курительными смесями
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-naphazoline.html'">
    Отравление препаратами нафазолина или ксилометазолина
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-opioids.html'">
    Отравление наркотиками группы опия (опиатами и опиоидами) и лоперамидом гидрохлоридом
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-potassium-permanganate.html'">
    Отравление калия перманганатом
  </button>
  
  <!-- Т -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-alcohol-ethanol.html'">
    Токсическое действие алкоголя этанола (этилового спирта)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-acids-alkalis.html'">
    Токсическое действие разъедающих веществ: кислот, едких щелочей. Токсическое действие мыл и детергентов
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-carbon-monoxide.html'">
    Токсическое действие окиси углерода, других газов, дымов и паров
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-halogen-hydrocarbons.html'">
    Токсическое действие галогенопроизводных алифатических и ароматических углеводородов, в т.ч. дихлорэтан, четыреххлористый углерод, хлороформ и др.
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-heavy-metals.html'">
    Токсическое действие соединений тяжелых металлов (растворы, пары, аэрозоли). Токсическое действие других неорганических веществ (мышьяк, фосфор и др.)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-methanol.html'">
    Токсическое действие метанола, органических растворителей в т.ч. этиленгликоля (тормозная и охлаждающая жидкости)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-pesticides.html'">
    Токсическое действие пестицидов, инсектицидов (фосфорорганические и карбаматные соединения)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-food-poisoning.html'">
    Токсическое действие других ядовитых веществ, содержащихся в съеденных пищевых продуктах (грибы, ягоды и другие растения)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-other.html'">
    Токсическое действие других и неуточненных веществ. Отравление цианидами. Отравление метгемоглобинобразователями (анилин, нитриты, производные бензола и другие вещества)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-toxic-animal.html'">
    Токсический эффект, обусловленный контактом с ядовитыми животными
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
