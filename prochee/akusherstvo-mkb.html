        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const container = document.getElementById('sectionsContainer');
        const searchInput = document.getElementById('searchInput');

        function renderSections(filter = '') {
            const lowerFilter = filter.toLowerCase().trim();
            let html = '';

            for (const section of sections) {
                let filteredRows = section.rows;
                if (lowerFilter !== '') {
                    filteredRows = section.rows.filter(row => {
                        return row.station.toLowerCase().includes(lowerFilter) ||
                            row.mkb.toLowerCase().includes(lowerFilter) ||
                            row.name.toLowerCase().includes(lowerFilter) ||
                            (row.note || '').toLowerCase().includes(lowerFilter);
                    });
                }
                if (filteredRows.length === 0) continue;

                html += `<div class="section">`;
                html += `<div class="section-header">`;
                html += `<div class="section-title">📌 ${escapeHtml(section.title)}</div>`;
                html += `</div>`;
                html += `<div class="grid">`;

                for (const row of filteredRows) {
                    const noteText = row.note && row.note.trim() !== '' ? row.note : '';
                    const descHtml = noteText ? `<div class="description"><em>${escapeHtml(noteText)}</em></div>` : '';

                    html += `
                        <div class="card">
                            <div class="disease-title">
                                <div class="disease-name">${escapeHtml(row.name)}</div>
                            </div>
                            <div class="code-block">
                                <div class="codes-row">
                                    <div class="mkb-line">МКБ-10: ${escapeHtml(row.mkb)}</div>
                                    <div class="inner-code-block"><strong>Код ССиНМП:</strong> ${escapeHtml(row.station)}</div>
                                </div>
                                ${descHtml}
                            </div>
                        </div>
                    `;
                }
                html += `</div></div>`;
            }

            if (html === '') {
                html = `<div class="no-results">🔎 Ничего не найдено по запросу «${escapeHtml(filter)}»</div>`;
            }
            container.innerHTML = html;
        }

        let timer;
        searchInput.addEventListener('input', function(e) {
            clearTimeout(timer);
            timer = setTimeout(() => {
                renderSections(this.value);
            }, 150);
        });

        renderSections('');
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/SMP/sw.js')
                .then(reg => console.log('✅ Service Worker зарегистрирован:', reg.scope))
                .catch(err => console.error('❌ Ошибка регистрации SW:', err));
        }
    })();
</script>
