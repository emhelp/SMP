<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Оториноларингология - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>👂 Оториноларингология</h1>

<div class="algorithms-menu">
  <button class="algorithms-btn" onclick="window.location.href='prochee/ear_abscess_furuncle.html'">
    Абсцесс, фурункул, карбункул ушной раковины или слухового прохода
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/inner_ear_diseases.html'">
    Болезни внутреннего уха (болезнь Меньера, нарушение вестибулярной функции, доброкачественное пароксизмальное головокружение, вестибулярный нейронит и др.). Лабиринтит, тугоухость
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/foreign_body_airway.html'">
    Инородное тело дыхательных путей
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/foreign_body_ear.html'">
    Инородное тело наружного слухового прохода
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/foreign_body_nose.html'">
    Инородное тело в носовом ходе
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/ear_canal_bleeding.html'">
    Кровотечение из наружного слухового прохода (посттравматическое)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/upper_airways_bleeding.html'">
    Кровотечение из других отделов верхних дыхательных путей (глотки, гортани). Кровотечение из трахеостомы
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/external_otitis.html'">
    Наружный отит. Другие болезни наружного уха
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/epistaxis.html'">
    Носовое кровотечение
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/acute_otitis_media.html'">
    Острый средний отит (серозный, гнойный и др.). Мастоидит
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/acute_sinusitis.html'">
    Острый синусит
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/peritonsillar_abscess.html'">
    Паратонзиллярный абсцесс, ретро- и парафарингеальный абсцесс, абсцесс глотки (язычной миндалины)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/fracture_nose.html'">
    Перелом костей носа
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/ear_burns.html'">
    Термические и химические ожоги уха (любой части) и перегородки носа. Термические и химические ожоги рта и глотки при ожогах I ст. Термический и химический ожог гортани и трахеи
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='prochee/traumatic_tympanic_membrane_rupture.html'">
    Травматический разрыв барабанной перепонки
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
