<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Неврология - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 14px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>🧠 Неврология</h1>

<div class="algorithms-menu">
  <!-- Б -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-peripheral-nervous-system.html'">
    Болезни периферической нервной системы и межпозвонковых дисков. Дорсалгия
  </button>
  
  <!-- В -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-inflammatory-cns.html'">
    Воспалительные болезни центральной нервной системы: менингит, энцефалит, энцефаломиелит, миелит, тромбофлебит внутричерепных венозных синусов, внутричерепной и внутрипозвоночный абсцесс, острый инфекционный полиневрит
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-secondary-parkinsonism.html'">
    Вторичный паркинсонизм (другие формы вторичного паркинсонизма, вызванного лекарственными средствами и др.). Дистония
  </button>
  
  <!-- Д -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-spinal-cord-diseases.html'">
    Другие болезни спинного мозга (острый инфаркт спинного мозга, сосудистая миелопатия, сдавление спинного мозга неуточненное)
  </button>
  
  <!-- З -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-neuroleptic-syndrome.html'">
    Злокачественный нейролептический синдром
  </button>
  
  <!-- И -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-stroke.html'">
    Инсульт, не уточненный как кровоизлияние или инфаркт мозга. Инфаркт мозга. Субарахноидальное кровоизлияние нетравматического происхождения. Внутримозговое кровоизлияние (геморрагический инсульт). Транзиторная ишемическая атака. Синдром вертебробазилярной артериальной системы
  </button>
  
  <!-- К -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-cognitive-disorders.html'">
    Когнитивные расстройства у лиц пожилого и старческого возраста
  </button>
  
  <!-- М -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-migraine.html'">
    Мигрень. Головная боль напряжения. Другой уточненный синдром головной боли. Головная боль
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-myasthenic-crisis.html'">
    Миастенический криз
  </button>
  
  <!-- О -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-syncope.html'">
    Обморок (синкопе)
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-acute-hypertensive-encephalopathy.html'">
    Острая гипертензивная энцефалопатия
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-wernicke-encephalopathy.html'">
    Острая энцефалопатия Гайе-Вернике
  </button>
  
  <!-- Р -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-multiple-sclerosis.html'">
    Рассеянный склероз
  </button>
  
  <!-- С -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-guillain-barre.html'">
    Синдром Гийена-Барре. Другие воспалительные полиневропатии. Воспалительная полиневропатия неуточненная
  </button>
  
  <!-- Э -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-epilepsy.html'">
    Эпилепсия. Другие и неуточненные судороги
  </button>
  
  <button class="algorithms-btn" onclick="window.location.href='algorithm-status-epilepticus.html'">
    Эпилептический статус
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
