<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Анестезиология и реанимация</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .anesthesiology-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .anesthesiology-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 12px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .anesthesiology-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .anesthesiology-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .anesthesiology-menu {
      max-width: 95%;
    }
    .anesthesiology-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<h1>🫁 Анестезиология и реанимация</h1>

<div class="anesthesiology-menu">
  <button class="anesthesiology-btn" onclick="window.location.href='anaphylactic_shock.html'">Анафилактический шок</button>
  <button class="anesthesiology-btn" onclick="window.location.href='allergic_laryngeal_edema_stenosis_2_8years.html'">Аллергический отек гортани, стеноз 2 степени, 8 лет</button>
  <button class="anesthesiology-btn" onclick="window.location.href='angioneurotic_edema.html'">Ангионевротический отек</button>
  <button class="anesthesiology-btn" onclick="window.location.href='asthmatic_status.html'">Астматический статус</button>
  <button class="anesthesiology-btn" onclick="window.location.href='arrhythmogenic_shock_atrial_fibrillation.html'">Аритмогенный шок при фибрилляции предсердий</button>
  <button class="anesthesiology-btn" onclick="window.location.href='bronchial_asthma_severe_acute_respiratory_failure_3.html'">Бронхиальная астма, тяжелое течение, обострение. Острая дыхательная недостаточность III степени</button>
  <button class="anesthesiology-btn" onclick="window.location.href='hypoglycemic_coma_type1.html'">Гипогликемическая кома I типа</button>
  <button class="anesthesiology-btn" onclick="window.location.href='hyperglycemic_coma_type1.html'">Гипергликемическая кома I типа</button>
  <button class="anesthesiology-btn" onclick="window.location.href='hypovolemic_shock_bedsores.html'">Гиповолемический шок с пролежнями</button>
  <button class="anesthesiology-btn" onclick="window.location.href='clinical_death_before_ems.html'">Клиническая смерть до СМП</button>
  <button class="anesthesiology-btn" onclick="window.location.href='clinical_death_hanging.html'">Клиническая смерть. Повешение</button>
  <button class="anesthesiology-btn" onclick="window.location.href='coma.html'">Кома неясной этиологии у пожилой</button>
  <button class="anesthesiology-btn" onclick="window.location.href='coma_unknown_etiology_young.html'">Кома неясной этиологии у молодого</button>
  <button class="anesthesiology-btn" onclick="window.location.href='coma_unknown_etiology_clinical_death_ambulance.html'">Кома неясной этиологии, клиническая смерть, констатация в а/м</button>
  <button class="anesthesiology-btn" onclick="window.location.href='coma_death_03.html'">Кома, смерть при 03</button>
  <button class="anesthesiology-btn" onclick="window.location.href='basic_resuscitation_single.html'">Стартовая реанимация (если на вызове один)</button>
  <button class="anesthesiology-btn" onclick="window.location.href='advanced_resuscitation_team.html'">Расширенная реанимация (если на вызове вдвоем)</button>
  <button class="anesthesiology-btn" onclick="window.location.href='drowning_aspiration_syndrome_child.html'">Утопление, аспирационный синдром, ребенок</button>
  <button class="anesthesiology-btn" onclick="window.location.href='drowning_alcohol_intoxication.html'">Утопление в алкогольном опьянении</button>
  <button class="anesthesiology-btn" onclick="window.location.href='brain_contusion_coma.html'">Ушиб головного мозга, кома, упал пьяный</button>
  <button class="anesthesiology-btn" onclick="window.location.href='brain_contusion_coma_elderly_woman.html'">Ушиб головного мозга, кома, пожилая женщина</button>
  <button class="neurology-btn" onclick="window.location.href='epilepsy_seizure_series.html'">Эпилепсия. Серия судорог ребенок 8 лет</button>
  <button class="anesthesiology-btn" onclick="window.location.href='epileptic_status_coma.html'">Эпилептический статус, кома</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ SW зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка:', err));
  }
</script>

</body>
</html>
