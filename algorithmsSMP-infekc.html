<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Инфекции - Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;
    font-size: 28px;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 14px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<h1>🦠 Инфекции</h1>

<div class="algorithms-menu">
  <!-- Б -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-bacterial-meningitis.html'">Бактериальный менингит неуточненный. Менингит, вызванный другими уточненными возбудителями</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-rabies.html'">Бешенство</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-botulism.html'">Ботулизм</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-brucellosis.html'">Бруцеллез</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-abdominal-typhus.html'">Брюшной тиф, паратифы</button>
  
  <!-- В -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-chickenpox-measles-rubella.html'">Ветряная оспа. Корь. Краснуха. Скарлатина. Эпидемический паротит. Иерсиниоз. Псевдотуберкулез. Коклюш</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-viral-hepatitis.html'">Вирусный гепатит</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-viral-fever-arthropod.html'">Вирусные лихорадки, передаваемые членистоногими, а также вирусные геморрагические лихорадки</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-viral-pneumonia.html'">Вирусная пневмония неуточненная</button>
  
  <!-- Г -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-herpes-zoster.html'">Герпес Зостер (опоясывающий лишай)</button>
  
  <!-- Д -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-diphtheria.html'">Дифтерия</button>
  
  <!-- И -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-infectious-mononucleosis.html'">Инфекционный мононуклеоз</button>
  
  <!-- Л -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-leptospirosis.html'">Лептоспироз</button>
  
  <!-- М -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-malaria.html'">Малярия</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-meningococcal-infection.html'">Менингококковая инфекция неуточненная. Менингококковый менингит. Менингококцемия</button>
  
  <!-- Н -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-new-coronavirus.html'">Новая коронавирусная инфекция (COVID-19)</button>
  
  <!-- О -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-acute-intestinal-infection.html'">Острые кишечные инфекции. Бактериальное пищевое отравление</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-acute-tonsillitis.html'">Острый тонзиллит, фарингит, тонзиллофарингит</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-ari-influenza.html'">Острая респираторная вирусная инфекция. Грипп</button>
  
  <!-- П -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-poliomyelitis.html'">Полиомиелит, вызванный диким вирусом</button>
  
  <!-- Р -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-erysipelas.html'">Рожа</button>
  
  <!-- С -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-serious-meningitis.html'">Серозный менингит и менингоэнцефалит. Клещевой энцефалит</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-tick-borne-borreliosis.html'">Системный клещевой иксодовый боррелиоз (болезнь Лайма)</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithm-tetanus.html'">Столбняк</button>
  
  <!-- Х -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-cholera.html'">Холера</button>
  
  <!-- Ч -->
  <button class="algorithms-btn" onclick="window.location.href='algorithm-plague.html'">Чума, оспа обезьян</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
