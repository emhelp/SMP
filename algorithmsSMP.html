<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Алгоритмы СМП</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1446">

<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    margin-bottom: 10px;
    color: #0f1446;
    font-size: 28px;
  }

  .info-text {
    max-width: 500px;
    width: 100%;
    margin: 0 auto 20px auto;
    background: #fff8e7;
    border: 1px solid #f0b849;
    border-radius: 16px;
    padding: 12px 20px;
    text-align: center;
    box-sizing: border-box;
    font-size: 14px;
    color: #5e5a3c;
    line-height: 1.4;
  }

  .algorithms-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .algorithms-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 16px 0;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 17px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .algorithms-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .algorithms-btn:active {
    transform: scale(0.98);
  }

  /* Стиль для неактивных кнопок */
  .algorithms-btn.disabled {
    background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
    cursor: not-allowed;
    opacity: 0.65;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .algorithms-menu {
      max-width: 95%;
    }
    .algorithms-btn {
      font-size: 16px;
      padding: 14px 0;
    }
    h1 {
      font-size: 24px;
    }
    .info-text {
      font-size: 12px;
      max-width: 95%;
    }
  }
</style>
</head>
<body>

<h1>📋 Алгоритмы СМП</h1>

<div class="info-text">
  Делаем "Алгоритмы", работа колоссальная, поэтому не торопите, будем работать по наличию свободного времени и при желании!
</div>

<div class="algorithms-menu">
  <button class="algorithms-btn" onclick="window.location.href='algorithmsSMP-air.html'">Анестезиология и реанимация</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithmsSMP-kardio.html'">Кардиология</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithmsSMP-neuro.html'">Неврология</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithmsSMP-terapy.html'">Терапия</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithmsSMP-infekc.html'">Инфекции</button>
  <button class="algorithms-btn" onclick="window.location.href='algorithmsSMP-stomat.html'">Стоматология</button>
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithmsSMP-lor.html'">Оториноларингология</button>
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithmsSMP-travma.html'">Травматология</button>
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithmsSMP-hirurg.html'">Хирургия</button>
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithmsSMP-urolog.html'">Урология</button>
  
  <!-- АКТИВНАЯ кнопка Акушерство и гинекология -->
  <button class="algorithms-btn" onclick="window.location.href='prochee/algorithmsSMP-ginecol.html'">Акушерство и гинекология</button>

  <!-- НЕАКТИВНЫЕ КНОПКИ -->
  <button class="algorithms-btn disabled" onclick="window.location.href='prochee/algorithmsSMP-oftalmo.html'">Офтальмология</button>
  <button class="algorithms-btn disabled" onclick="window.location.href='prochee/algorithmsSMP-toxic.html'">Токсикология</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/SMP/sw.js')
      .then(reg => console.log('✅ Сервис-воркер зарегистрирован:', reg))
      .catch(err => console.error('❌ Ошибка регистрации:', err));
  }
</script>

</body>
</html>
