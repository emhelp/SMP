<style>
  body {
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #0f1446;

  }

  .infectious-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  .infectious-btn {
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0f1446 0%, #1a1f5e 100%);
    padding: 14px 12px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .infectious-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .infectious-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 600px) {
    .infectious-menu {
      max-width: 95%;
    }
    .infectious-btn {
      font-size: 13px;
      padding: 12px 8px;
    }
    h1 {
      font-size: 24px;
    }
  }
</style>
